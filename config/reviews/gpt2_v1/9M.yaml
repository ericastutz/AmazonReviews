name: '9M'
data_dir: './data/reviews/v_32768'
out_dir: './out/reviews/gpt2_v1/9M'
dataloader: 'standard'
log: True
init_from: 'new'

model:
  name: 'gpt2_v1'
  total_batch_size: 262144
  batch_size: 512
  block_size: 512
  n_heads: 2
  n_layer: 2
  n_embd: 128
  vocab_size: 32786
  max_iters: 50000
  device: 'cuda'
  eval_iters: 100
  eval_interval: 100
  learning_rate: 0.0003
  warmup_iters: 1000
  lr_decay_iters: 49000
  beta1: 0.9
  beta2: 0.95
  clip_grad: True
  weight_decay: 0.05
  eps: 0.00000001
  dropout: 0
  bias: 0